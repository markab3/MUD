# Sample area file. Format: specs/ROOM_FILES.md.
# Import with the creator command:  import sample_area
# (Content directory is set by WorldSettings:ContentDirectory; see appsettings.json.)
area:
  schema_version: 1
  prefix: sample_area
  name: "Sample Area"
  description: "A tiny area demonstrating exits, reverse exits, features, a search property, and a hidden button (search floor, press button) that opens a timed secret exit down to a vault."
  defaults:
    coords:
      z: 0

rooms:
  - key: hall
    short: "a small stone hall"
    long: "Pale light spills through a high window onto a worn stone floor."
    handles: [hall]
    coords: {x: 0, y: 0}
    exits:
      - dir: north
        to: study
        reverse: south
      - dir: up
        to: landing
        reverse: down
    features:
      - short: "a heavy oak table"
        long: "The table is scarred by years of use. Something might be hidden on it."
        room_line: "A heavy oak table stands against the far wall."
        handles: [table]
        adjectives: [heavy, oak]
        plurals: [tables]
    behaviors:
      # The hidden button: "search floor" (the core search entry below) grants the per-player discovery hidden_button;
      # "press button" then opens a down exit for open_for_s seconds. Both hooks are needed: command.entered takes the
      # line, heartbeat closes the exit again.
      - hook: command.entered
        module: secretexit
        type: SecretExit
        config:
          discovery: hidden_button
          verb: press
          noun: button
          dir: down
          to: sample_area.secret_vault
          open_for_s: 60
          press_msg: "You press the button."
          open_msg: "A section of the floor grinds aside, revealing stairs leading down."
          already_open_msg: "The stairs leading down are already open."
          close_msg: "The section of floor grinds shut again, hiding the stairs."
          close_dest_msg: "With a grinding noise the stairs above seal themselves shut."
      - hook: heartbeat
        module: secretexit
        type: SecretExit
        config:
          to: sample_area.secret_vault
    properties:
      - behavior: search
        id: table_search
        params:
          target: table
          refresh_ms: 600000
          reward:
            short: "a really cool sword"
            long: "A sword that is really, truly cool."
            handles: [sword]
            adjectives: [cool]
            plurals: [swords]
      - behavior: search
        id: floor_search
        params:
          target: floor
          refresh_ms: 0
          discovery:
            id: hidden_button
            found: "You search the floor and find a small hidden button!"
            again: "You have already found the button here."

  - key: study
    short: "a cluttered study"
    long: >
      Books lie in drifts on every surface. A narrow window overlooks
      the astral void.
    coords: {x: 0, y: 1}

  - key: landing
    short: "a drafty landing"
    long: "A small landing at the top of a spiral stair. The air is cold here."
    coords: {x: 0, y: 0, z: 1}


  # Reached only through the timed secret exit of the hall (down). The way back up is a permanent exit.
  - key: secret_vault
    short: "Inside a Dark Stone Vault"
    long: "This is the inside of a stone vault, left abandoned for countless years. A layer of dust covers the floor and carved stone walls. The roof is constructed of the same cold, unmoving stone and looms oppressively above."
    coords: {x: 0, y: 0, z: -1}
    exits:
      - dir: up
        to: hall
