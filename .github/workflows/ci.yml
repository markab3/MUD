name: CI

on:
  pull_request:
    branches: [hermes]
  push:
    branches: [hermes]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # All projects target net8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MUD.sln

      - name: Build
        run: dotnet build MUD.sln --no-restore

      - name: Test
        run: dotnet test MUD.sln --no-build
