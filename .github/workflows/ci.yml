name: CI

on:
  pull_request:
    branches: [hermes]
  push:
    branches: [hermes]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Projects target netcoreapp3.1. The 3.1 SDK cannot run on current Ubuntu images (OpenSSL 3),
      # so build with the 8.0 SDK (it builds netcoreapp3.1 targets) and also install the 3.1
      # runtime so test projects targeting netcoreapp3.1 can run.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            3.1.x

      - name: Restore
        run: dotnet restore MUD.sln

      - name: Build
        run: dotnet build MUD.sln --no-restore

      # hermes has no test project yet. Skip tests only until one exists
      # (a project referencing Microsoft.NET.Test.Sdk); remove this guard once tests merge.
      - name: Detect test projects
        id: tests
        run: |
          if grep -rlq "Microsoft.NET.Test.Sdk" --include=*.csproj .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test project found; skipping dotnet test."
          fi

      - name: Test
        if: steps.tests.outputs.found == 'true'
        # The 3.1 runtime crashes on OpenSSL 3 (no libssl 1.x), so run the tests on the newest installed runtime.
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet test MUD.sln --no-build
