syntax = "proto3";

// Admin service, served on frontends.sock only (D22, D66, never on modules.sock). Used by the web front end (phase 6).
// Every call except WebAuthenticate carries the opaque session token core issued at web authentication (D31). Core
// re-checks the player's CURRENT role on every call and can revoke a session (retire or demote takes effect at once).
// Unary calls only (D66). A bad, revoked or unknown token answers gRPC status Unauthenticated; a role too low for the
// call answers PermissionDenied. Rule-based refusals (a creator editing an admin and so on) come back in the reply's
// result field instead. Rev is dropped (D30): edits are last-write-wins and the per-field audit keeps the history.
// Specified in specs/ADMIN_API.md.

package mud;

import "mud/common.proto";
import "mud/frontend.proto";

option csharp_namespace = "MUD.Contracts";

service Admin {
  rpc WebAuthenticate(WebAuthRequest) returns (WebAuthReply);
  rpc Logout(TokenRequest) returns (Ack);
  // The player name and CURRENT role behind a token (the role is re-read from the player on every call).
  rpc GetSession(TokenRequest) returns (SessionInfoReply);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordReply);

  // Creator or admin.
  rpc ListRooms(TokenRequest) returns (ListRoomsReply);
  rpc GetRoom(GetRoomRequest) returns (GetRoomReply);
  rpc CreateRoom(RoomEditRequest) returns (RoomEditReply);
  rpc UpdateRoom(RoomEditRequest) returns (RoomEditReply);
  rpc DeleteRoom(DeleteRoomRequest) returns (RoomEditReply);
  rpc MoveRoom(MoveRoomRequest) returns (RoomEditReply);
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersReply);
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerReply);
  rpc UpdatePlayer(UpdatePlayerRequest) returns (UpdatePlayerReply);
  // Every module core knows (directory discovery, D67), stopped and never-started ones included.
  rpc ListModules(TokenRequest) returns (ListModulesReply);

  // Admin only.
  rpc ListAudit(ListAuditRequest) returns (ListAuditReply);
  // Queue a start, stop or restart of one module on the supervisor. All modules, required ones included, may be controlled. The
  // supervisor acts on its own thread, so OK means the request was accepted, not that the module has changed state yet; ListModules
  // shows the outcome. Audited first. Restart starts the new instance before ending the old one (MODULES 5.3a); restart of a stopped
  // module is a start.
  rpc StartModule(ModuleRequest) returns (ModuleActionReply);
  rpc StopModule(ModuleRequest) returns (ModuleActionReply);
  rpc RestartModule(ModuleRequest) returns (ModuleActionReply);

  // Terrain library (specs/TERRAIN_GENERATORS.md section 6). Creator or admin. Reads answer from the stored documents; writes are
  // audited first (entity terrain_fragment, terrain_feature or terrain_neighbor_phrase), then written, then the library version is
  // incremented. Create answers ALREADY_EXISTS for a taken id; update and delete answer NOT_FOUND for an unknown id. REFUSED means the
  // library is not available (no store). An empty `terrains` list means the entity is used by no generator (it is not "any terrain").
  rpc ListFragments(TokenRequest) returns (ListFragmentsReply);
  rpc GetFragment(LibraryIdRequest) returns (GetFragmentReply);
  rpc CreateFragment(SaveFragmentRequest) returns (LibraryEditReply);
  rpc UpdateFragment(SaveFragmentRequest) returns (LibraryEditReply);
  rpc DeleteFragment(LibraryIdRequest) returns (LibraryEditReply);
  rpc ListFeatureTemplates(TokenRequest) returns (ListFeatureTemplatesReply);
  rpc GetFeatureTemplate(LibraryIdRequest) returns (GetFeatureTemplateReply);
  rpc CreateFeatureTemplate(SaveFeatureTemplateRequest) returns (LibraryEditReply);
  rpc UpdateFeatureTemplate(SaveFeatureTemplateRequest) returns (LibraryEditReply);
  rpc DeleteFeatureTemplate(LibraryIdRequest) returns (LibraryEditReply);
  rpc ListNeighborPhrases(TokenRequest) returns (ListNeighborPhrasesReply);
  rpc GetNeighborPhrase(LibraryIdRequest) returns (GetNeighborPhraseReply);
  rpc CreateNeighborPhrase(SaveNeighborPhraseRequest) returns (LibraryEditReply);
  rpc UpdateNeighborPhrase(SaveNeighborPhraseRequest) returns (LibraryEditReply);
  rpc DeleteNeighborPhrase(LibraryIdRequest) returns (LibraryEditReply);

  // Regen and update of generated rooms (specs/TERRAIN_GENERATORS.md section 9). Creator or admin. A room is generated when it has
  // provenance (RoomDetail.gen). RegenerateMap and RegenerateRooms replace description, ALL features (hand-added too), properties and
  // behaviors with the generator's output; exits follow the map; items and occupants stay. UpdateRooms rewrites only features that carry
  // a template reference, when the library template is newer. All three are audited first (one row per changed room, field *regen* or
  // *update*), write through the importer, and refresh the live rooms. dry_run reports without writing or auditing. The reply carries one
  // line per room; a failure that stops everything (library or map unavailable, map errors, audit failure) is in `errors`/`result`.
  rpc RegenerateMap(RegenerateMapRequest) returns (GenerationReply);
  rpc RegenerateRooms(RegenerateRoomsRequest) returns (GenerationReply);
  rpc UpdateRooms(UpdateRoomsRequest) returns (GenerationReply);
}

enum AdminRole {
  ADMIN_ROLE_UNSPECIFIED = 0;
  ADMIN_ROLE_PLAYER = 1;
  ADMIN_ROLE_CREATOR = 2;
  ADMIN_ROLE_ADMIN = 3;
}

// The outcome of an edit. Mirrors the website's save statuses (specs/WEB_EDITING.md) without the conflict status (D30).
enum AdminResult {
  ADMIN_RESULT_UNSPECIFIED = 0;
  ADMIN_RESULT_OK = 1;
  ADMIN_RESULT_NO_CHANGE = 2;
  ADMIN_RESULT_INVALID = 3;
  ADMIN_RESULT_NOT_FOUND = 4;
  ADMIN_RESULT_ALREADY_EXISTS = 5;
  ADMIN_RESULT_FORBIDDEN = 6;
  ADMIN_RESULT_REFUSED = 7;
  ADMIN_RESULT_LAST_ADMIN = 8;
  ADMIN_RESULT_AUDIT_FAILED = 9;
  ADMIN_RESULT_FAILED = 10;
}

message TokenRequest { string token = 1; }

message FieldError {
  string field = 1;
  string message = 2;
}

message WebAuthRequest {
  string name = 1;
  // Plaintext by earlier owner decision; never logged, never audited.
  string password = 2;
  // The opaque throttle key, normally the browser's address as the web passes it in; shared with telnet (D43).
  string remote_key = 3;
}

// result is AUTH_OK, AUTH_BAD_CREDENTIALS, AUTH_RETIRED, AUTH_THROTTLED or AUTH_TRY_AGAIN_LATER. The token is empty unless AUTH_OK.
message WebAuthReply {
  AuthResult result = 1;
  string token = 2;
  string player_name = 3;
  AdminRole role = 4;
}

message SessionInfoReply {
  string player_name = 1;
  AdminRole role = 2;
}

message ChangePasswordRequest {
  string token = 1;
  string current_password = 2;
  string new_password = 3;
  string confirm_password = 4;
}

enum PasswordChangeOutcome {
  PASSWORD_CHANGE_OUTCOME_UNSPECIFIED = 0;
  PASSWORD_CHANGE_OUTCOME_CHANGED = 1;
  PASSWORD_CHANGE_OUTCOME_WRONG_CURRENT = 2;
  PASSWORD_CHANGE_OUTCOME_MISMATCH = 3;
  PASSWORD_CHANGE_OUTCOME_SAME = 4;
  PASSWORD_CHANGE_OUTCOME_INVALID = 5;
  PASSWORD_CHANGE_OUTCOME_SAVE_FAILED = 6;
}

message ChangePasswordReply {
  PasswordChangeOutcome outcome = 1;
  // Set when the outcome is PASSWORD_CHANGE_OUTCOME_INVALID: the rule that was broken. Never contains the password.
  string message = 2;
}

message RoomExit {
  string name = 1;
  // The full key of the target room.
  string to = 2;
}

// A room Feature as the web can represent it (specs/ROOM_FILES.md 4.4). Identity within a room is `short`, case-insensitive.
// room_line and detail are optional: empty means unset. Behavior or component data a Feature carries is not part of this message.
message RoomFeature {
  string short = 1;
  string long = 2;
  string room_line = 3;
  string detail = 4;
  repeated string handles = 5;
  repeated string adjectives = 6;
  repeated string plurals = 7;
  // The library template this feature was generated from, and its version at that time. Empty / 0 for authored features.
  // Read-only: UpdateRoom keeps the stored values for a matched feature and ignores what a client sends.
  string template_id = 8;
  int32 template_version = 9;
}

// Generator provenance of a room (RoomDetail.gen); absent for authored rooms.
message RoomGen { string map = 1; string terrain = 2; string seed = 3; int32 lib_version = 4; }

// Definition fields of a room. x, y, z are absent when the room is unplaced (blank is never 0).
message RoomDetail {
  string key = 1;
  string short_description = 2;
  string long_description = 3;
  string area = 4;
  optional int32 x = 5;
  optional int32 y = 6;
  optional int32 z = 7;
  repeated RoomExit exits = 8;
  // The room's Features in stored order.
  repeated RoomFeature features = 9;
  // Generator provenance. Absent for authored rooms; present means the generator owns the room (regen and update apply).
  RoomGen gen = 10;
}

message ListRoomsReply { repeated RoomDetail rooms = 1; }

message GetRoomRequest {
  string token = 1;
  string key = 2;
}

message GetRoomReply {
  bool found = 1;
  RoomDetail room = 2;
}

// Used for CreateRoom (key is the FULL key, area.local) and UpdateRoom. The whole form is sent; core diffs it
// against the room and audits only the fields that changed.
message RoomEditRequest {
  string token = 1;
  string key = 2;
  string short_description = 3;
  string long_description = 4;
  string area = 5;
  optional int32 x = 6;
  optional int32 y = 7;
  optional int32 z = 8;
  repeated RoomExit exits = 9;
  // Save exits whose target room does not exist.
  bool confirm_dangling = 10;
  // The FULL replacement Feature list, in the order wanted. Applied only when features_present is true: a caller that predates
  // this field leaves it false and the room's Features stay exactly as they are. true with an empty list removes every Feature.
  // Features are matched to the room's own by short (case-insensitive); see specs/ADMIN_API.md.
  bool features_present = 11;
  repeated RoomFeature features = 12;
}

message DeleteRoomRequest {
  string token = 1;
  string key = 2;
}

// Gives a room a new key: new_area + "." + new_local_key. Exits that led to it, players standing in it and its contents follow.
message MoveRoomRequest {
  string token = 1;
  string key = 2;
  string new_area = 3;
  string new_local_key = 4;
}

// Reply of CreateRoom, UpdateRoom, DeleteRoom and MoveRoom. room is the room as it is now (absent after a delete or when none exists).
message RoomEditReply {
  AdminResult result = 1;
  repeated FieldError errors = 2;
  RoomDetail room = 3;
  // A fixed sentence for REFUSED, or a note after a delete. Never contains stored values.
  string message = 4;
}

message PlayerSummary {
  string name_key = 1;
  string name = 2;
  string race = 3;
  string class = 4;
  string gender = 5;
  string location = 6;
  AdminRole role = 7;
  bool retired = 8;
}

// The editable view of one player. There is no password, inventory, equipment or location field on purpose.
message PlayerDetail {
  string name_key = 1;
  string name = 2;
  string short_description = 3;
  string long_description = 4;
  string race = 5;
  string gender = 6;
  string class = 7;
  bool retired = 8;
  AdminRole role = 9;
}

message ListPlayersRequest {
  string token = 1;
  // Case-insensitive substring of the player name; empty lists everyone.
  string name_filter = 2;
  bool descending = 3;
  // 1-based. page_size is clamped to 1..200.
  int32 page = 4;
  int32 page_size = 5;
}

message ListPlayersReply {
  repeated PlayerSummary items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetPlayerRequest {
  string token = 1;
  string name_key = 2;
}

message GetPlayerReply {
  bool found = 1;
  PlayerDetail player = 2;
}

message UpdatePlayerRequest {
  string token = 1;
  string name_key = 2;
  string short_description = 3;
  string long_description = 4;
  string race = 5;
  string gender = 6;
  string class = 7;
  // Absent means leave as it is.
  optional bool retired = 8;
  optional AdminRole role = 9;
}

message UpdatePlayerReply {
  AdminResult result = 1;
  repeated FieldError errors = 2;
  PlayerDetail player = 3;
}

message ListAuditRequest {
  string token = 1;
  // Both optional filters; empty matches everything.
  string entity = 2;
  string entity_id = 3;
  int32 page = 4;
  int32 page_size = 5;
}

// One row per changed field. old_value and new_value are the stored values rendered as JSON text; an absent value is "null".
message AuditRow {
  string id = 1;
  int64 at_unix_ms = 2;
  string actor_id = 3;
  string actor_name = 4;
  string actor_role = 5;
  string entity = 6;
  string entity_id = 7;
  string entity_name = 8;
  string field = 9;
  string old_value = 10;
  string new_value = 11;
  string source = 12;
  bool applied = 13;
  bool rejected = 14;
}

message ListAuditReply {
  repeated AuditRow items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// The supervisor's state machine (MODULES section 3). Mirrors MUD.Core.Modules.ModuleState.
enum ModuleRunState {
  MODULE_RUN_STATE_UNSPECIFIED = 0;
  MODULE_RUN_STATE_STOPPED = 1;
  MODULE_RUN_STATE_STARTING = 2;
  MODULE_RUN_STATE_CONNECTED = 3;
  MODULE_RUN_STATE_READY = 4;
  MODULE_RUN_STATE_BACKOFF = 5;
  MODULE_RUN_STATE_FAILED = 6;
  MODULE_RUN_STATE_REFUSED = 7;
  MODULE_RUN_STATE_STOPPING = 8;
}

message ModuleInfo {
  string name = 1;
  // From the module's --describe output; empty when it could not be described.
  string version = 2;
  ModuleRunState state = 3;
  // Derived: true when the state is CONNECTED or READY.
  bool running = 4;
  bool required = 5;
  // Why the module cannot start, was refused, or last ended (core's own wording); empty when there is none.
  string last_failure = 6;
  // The module's folder is gone from the modules directory.
  bool folder_missing = 7;
}

message ListModulesReply { repeated ModuleInfo modules = 1; }

message ModuleRequest {
  string token = 1;
  string name = 2;
}

// result: OK (queued), NO_CHANGE (already running or already stopped), NOT_FOUND (no such module), REFUSED (a required module is not
// stopped from here, the module cannot start, or the supervisor is not running), AUDIT_FAILED. module is the module as it is now.
message ModuleActionReply {
  AdminResult result = 1;
  string message = 2;
  ModuleInfo module = 3;
}

// ---------------------------------------------------------------------------------------------------------------------
// Terrain library (specs/TERRAIN_GENERATORS.md section 6.1)

message FragmentRecord {
  string id = 1;
  // Terrain ids that use the entity. EMPTY = used by no generator (disabled/unassigned), never "any terrain".
  repeated string terrains = 2;
  string slot = 3;
  string text = 4;
  int32 weight = 5;
  repeated string tags = 6;
}

message FeatureTemplateRecord {
  string id = 1;
  repeated string terrains = 2;
  string short = 3;
  string long = 4;
  repeated string handles = 5;
  repeated string adjectives = 6;
  string room_line = 7;
  string detail = 8;
  int32 weight = 9;
  double chance = 10;
  // Server-owned: the client-sent value is ignored. Create sets 1; update sets stored + 1 when any of short, long, handles,
  // adjectives, room_line or detail changed (weight, chance, terrains and tags edits do not bump it).
  int32 version = 11;
  repeated string tags = 12;
}

message NeighborPhraseRecord {
  string id = 1;
  // The ROOM terrains the phrase may appear in. EMPTY = unused.
  repeated string terrains = 2;
  string neighbor_terrain = 3;
  // Contains {dir} exactly once.
  string text = 4;
  int32 weight = 5;
  bool merge = 6;
}

message LibraryIdRequest {
  string token = 1;
  string id = 2;
}

message SaveFragmentRequest {
  string token = 1;
  FragmentRecord fragment = 2;
}

message SaveFeatureTemplateRequest {
  string token = 1;
  FeatureTemplateRecord template = 2;
}

message SaveNeighborPhraseRequest {
  string token = 1;
  NeighborPhraseRecord phrase = 2;
}

message ListFragmentsReply { repeated FragmentRecord fragments = 1; int32 library_version = 2; }
message ListFeatureTemplatesReply { repeated FeatureTemplateRecord templates = 1; int32 library_version = 2; }
message ListNeighborPhrasesReply { repeated NeighborPhraseRecord phrases = 1; int32 library_version = 2; }
message GetFragmentReply { bool found = 1; FragmentRecord fragment = 2; }
message GetFeatureTemplateReply { bool found = 1; FeatureTemplateRecord template = 2; }
message GetNeighborPhraseReply { bool found = 1; NeighborPhraseRecord phrase = 2; }

// Reply of every create, update and delete of a library entity.
// result: OK; NO_CHANGE (update with nothing changed); INVALID (errors lists the fields); NOT_FOUND (update/delete: unknown id);
// ALREADY_EXISTS (create: the id is taken); REFUSED (the library is not available); AUDIT_FAILED; FAILED (the database write failed).
// Exactly one of fragment, template and phrase is set after a create or update (the entity as stored); none after a delete.
message LibraryEditReply {
  AdminResult result = 1;
  repeated FieldError errors = 2;
  // The library version after the write (unchanged for anything but OK).
  int32 library_version = 3;
  // A fixed sentence. Never contains stored values.
  string message = 4;
  FragmentRecord fragment = 5;
  FeatureTemplateRecord template = 6;
  NeighborPhraseRecord phrase = 7;
}

// ---- Regen and update of generated rooms (specs/TERRAIN_GENERATORS.md sections 9 and 10) ----

// new_seed is optional: empty keeps the stored seed (the same library gives the same output), a value rerolls.
message RegenerateMapRequest { string token = 1; string map = 2; bool dry_run = 3; string new_seed = 4; }
message RegenerateRoomsRequest { string token = 1; repeated string keys = 2; bool dry_run = 3; string new_seed = 4; }
message UpdateRoomsRequest { string token = 1; repeated string keys = 2; bool dry_run = 3; }

enum RoomGenOutcome {
  ROOM_GEN_OUTCOME_UNSPECIFIED = 0;
  ROOM_GEN_REPLACED = 1;
  ROOM_GEN_UNCHANGED = 2;
  ROOM_GEN_NOT_OWNED = 3;
  ROOM_GEN_MAP_NOT_FOUND = 4;
  ROOM_GEN_ERROR = 5;
  ROOM_GEN_UPDATED = 6;
  ROOM_GEN_NOT_GENERATED = 7;
}

enum FeatureUpdateOutcome {
  FEATURE_UPDATE_OUTCOME_UNSPECIFIED = 0;
  FEATURE_UPDATED = 1;
  FEATURE_CURRENT = 2;
  FEATURE_TEMPLATE_DELETED = 3;
  FEATURE_NEWER_IN_ROOM = 4;
  FEATURE_CONFLICT = 5;
}

message FeatureUpdateLine {
  string feature_short = 1;
  string template_id = 2;
  FeatureUpdateOutcome outcome = 3;
  int32 from_version = 4;
  int32 to_version = 5;
}

message RoomGenLine {
  string key = 1;
  RoomGenOutcome outcome = 2;
  string detail = 3;
  repeated FeatureUpdateLine features = 4;
}

// result: OK (the operation ran; per-room outcomes are in rooms), NO_CHANGE (ran, nothing differed), INVALID (errors says why; nothing
// written), REFUSED (the library is not available), AUDIT_FAILED (nothing written), FAILED (a write failed part way; re-run to finish).
message GenerationReply {
  AdminResult result = 1;
  repeated string errors = 2;
  repeated RoomGenLine rooms = 3;
  // Map regen only: rooms of the area no longer in the map. Never deleted.
  repeated string orphans = 4;
  bool dry_run = 5;
  int32 library_version = 6;
  // Regen: rooms replaced / unchanged. Update: features updated / current (unchanged) / whose template was deleted.
  int32 updated_count = 7;
  int32 unchanged_count = 8;
  int32 deleted_template_count = 9;
}
