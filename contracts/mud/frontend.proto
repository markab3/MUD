syntax = "proto3";

// Front-end service, served on frontends.sock (D22). Same style as the module service (D66): the front end opens a
// server stream to receive output and session events, and makes separate unary calls for lines, login, create
// player and close. No two-way stream. Front ends are started by systemd, so the token comes from a mode-600 file
// the front end reads at start (D66). Specified in specs/CORE_API.md sections 6.1 and 7.2.

package mud;

import "mud/common.proto";

option csharp_namespace = "MUD.Contracts";

service Session {
  rpc Connect(FrontEndHello) returns (FrontEndWelcome);
  // Server stream of output and session events for every session of this front end.
  rpc Events(SessionEventsRequest) returns (stream SessionEvent);
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionReply);
  rpc Authenticate(AuthRequest) returns (AuthReply);
  rpc CreatePlayer(CreatePlayerRequest) returns (AuthReply);
  rpc Line(LineRequest) returns (Ack);
  rpc CloseSession(CloseSessionRequest) returns (Ack);
  // The remaining calls of ICoreApi that the telnet login dialogue makes (card P7-1): the brute-force throttle (D43,
  // one limit shared with the web, key = the address the front end passes in) and the pre-login who list.
  rpc IsThrottled(ThrottleRequest) returns (ThrottleReply);
  rpc RecordLoginOutcome(LoginOutcomeRequest) returns (Ack);
  rpc GetOnlineNames(OnlineNamesRequest) returns (OnlineNamesReply);
}

message FrontEndHello {
  // For example "telnet" or "web".
  string name = 1;
  string token = 2;
  // Strict equality, as for modules (D24).
  uint32 contract_version = 3;
}

message FrontEndWelcome {
  bool ok = 1;
  string connection_id = 2;
  string refusal = 3;
  uint32 core_contract_version = 4;
}

message SessionEventsRequest { string connection_id = 1; }

message SessionEvent {
  string session_id = 1;
  oneof body {
    Output output = 10;
    SetEcho set_echo = 11;
    Prompt prompt = 12;
    CloseFromCore close = 13;
    SessionEnded ended = 14;
    SetTerminal set_terminal = 15;
  }
}

// channel is one of: say, tell, room, combat, system, chat (D44). Empty means system. text is %^Color%^ markup (D28).
message Output {
  string channel = 1;
  string text = 2;
  bool flush = 3;
}

message SetEcho { bool hidden = 1; }

// Text without a line ending.
message Prompt { string text = 1; }

message CloseFromCore {
  string farewell = 1;
  bool flush = 2;
}

// The terminal the player chose (the persisted setting, pushed at login and when it changes). The front end converts
// the markup of later output for it; a name it does not know leaves the markup as it is.
message SetTerminal { string name = 1; }

// reason: quit, taken_over, shutdown ("world is restarting", D29), ...
message SessionEnded { string reason = 1; }

message OpenSessionRequest {
  string connection_id = 1;
  // The opaque throttle key, normally the remote address the front end passes in (D43).
  string remote_key = 2;
  uint32 terminal_width = 3;
  uint32 terminal_height = 4;
  bool supports_echo_control = 5;
}

// The session id is an opaque random string generated by core (D46).
message OpenSessionReply {
  string session_id = 1;
}

message AuthRequest {
  string connection_id = 1;
  string session_id = 2;
  string name = 3;
  // Plaintext by earlier owner decision; never logged.
  string password = 4;
}

message CreatePlayerRequest {
  string connection_id = 1;
  string session_id = 2;
  string name = 3;
  string password = 4;
}

enum AuthResult {
  AUTH_RESULT_UNSPECIFIED = 0;
  AUTH_OK = 1;
  AUTH_BAD_CREDENTIALS = 2;
  AUTH_RETIRED = 3;
  AUTH_THROTTLED = 4;
  AUTH_ALREADY_ONLINE = 5;
  AUTH_NAME_TAKEN = 6;
  AUTH_TRY_AGAIN_LATER = 7;
}

message AuthReply {
  AuthResult result = 1;
  string message = 2;
}

message LineRequest {
  string connection_id = 1;
  string session_id = 2;
  // Already stripped of telnet control codes and control characters by the front end.
  string line = 3;
}

message CloseSessionRequest {
  string connection_id = 1;
  string session_id = 2;
  // client_closed, idle, flood, ...
  string reason = 3;
}

message ThrottleRequest {
  string connection_id = 1;
  string remote_key = 2;
}

message ThrottleReply { bool throttled = 1; }

message LoginOutcomeRequest {
  string connection_id = 1;
  string remote_key = 2;
  bool success = 3;
}

message OnlineNamesRequest { string connection_id = 1; }

message OnlineNamesReply { repeated string names = 1; }
