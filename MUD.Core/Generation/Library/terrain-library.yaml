# Terrain library seed (specs/TERRAIN_GENERATORS.md section 6.2).
# Loaded into MongoDB ONLY on a fresh install (no terrain_meta "library" document). After that the database is the truth and edits
# are made through the admin API; changing this file does not change an existing install.
# `terrains: []` would mean "used by no generator" (never "any terrain").
schema_version: 1
library_version: 1

fragments:
  - id: grass-short-1
    terrains: [grass]
    slot: short
    text: "a grassy meadow"
    weight: 2
  - id: grass-short-2
    terrains: [grass]
    slot: short
    text: "an open field"
    weight: 1
  - id: grass-ground-1
    terrains: [grass]
    slot: ground
    text: "Short green grass carpets the ground."
    weight: 3
    tags: [dry]
  - id: grass-ground-2
    terrains: [grass]
    slot: ground
    text: "Tall grass sways in the breeze."
    weight: 2
    tags: [dry]
  - id: forest-short-1
    terrains: [forest]
    slot: short
    text: "a shaded forest"
    weight: 2
  - id: forest-short-2
    terrains: [forest]
    slot: short
    text: "deep in the woods"
    weight: 1
  - id: forest-ground-1
    terrains: [forest]
    slot: ground
    text: "Tall trees crowd close and the ground is thick with fallen leaves."
    weight: 3
  - id: forest-ground-2
    terrains: [forest]
    slot: ground
    text: "Roots twist across a floor of moss and needles."
    weight: 2
  - id: river-short-1
    terrains: [river]
    slot: short
    text: "a flowing river"
    weight: 1
  - id: river-ground-1
    terrains: [river]
    slot: ground
    text: "Cold water runs swiftly over smooth stones."
    weight: 1

features:
  - id: boulder-grey
    terrains: [grass, forest]
    short: "a grey boulder"
    long: "A lichen-spotted boulder sits half buried in the earth."
    handles: [boulder, rock]
    adjectives: [grey, lichen-spotted]
    roomLine: "A grey boulder squats nearby."
    detail: "The boulder is cold and rough, and dotted with pale lichen."
    weight: 2
    chance: 0.15
    version: 1
  - id: fallen-log
    terrains: [forest]
    short: "a fallen log"
    long: "A moss-covered log lies where it fell, soft with rot."
    handles: [log, trunk]
    adjectives: [fallen, mossy]
    roomLine: "A fallen log lies across the ground."
    weight: 1
    chance: 0.2
    version: 1

neighborPhrases:
  - id: river-near
    terrains: [grass, forest]
    neighborTerrain: river
    text: "A river flows just {dir} of here."
    weight: 2
    merge: true
  - id: river-near-alt
    terrains: [grass, forest]
    neighborTerrain: river
    text: "You hear running water to the {dir}."
    weight: 1
    merge: true
  - id: forest-near
    terrains: [grass]
    neighborTerrain: forest
    text: "Trees crowd together to the {dir}."
    weight: 1
    merge: true
